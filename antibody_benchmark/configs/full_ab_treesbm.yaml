# Full rollout using Ab-trained TreeSBM (checkpoints/ab_dasm_v1/best.pt).
# Same 82 Rodriguez families × N=20 as configs/full.yaml.
seed: 42
n_rollouts: 20
n_bootstrap: 1000
bootstrap_ci: 0.95

paths:
  raw_dasm: antibody_benchmark/data/raw/dasm/extracted/dasm-experiments-data
  raw_cosine_ckpt: antibody_benchmark/data/raw/cosine/checkpoints/cosine_dasm.ckpt
  raw_cosine_data: antibody_benchmark/data/raw/cosine/hf_dataset
  processed: antibody_benchmark/data/processed
  splits: antibody_benchmark/data/splits
  results: antibody_benchmark/results
  netam_repo: antibody_benchmark/data/raw/repos/netam
  cosine_repo: antibody_benchmark/data/raw/repos/cosine

dataset:
  primary_pcp: v3/rodriguez-airr-seq-race-prod-NoWinCheck_igh_pcp_2024-11-12_MASKED_NI_noN_no-naive.csv.gz
  chain: heavy
  min_leaves: 4
  min_depth: 2
  require_single_root: true
  alphabet_for_metrics: aa
  max_families: null

models:
  thrifty:
    name: ThriftyHumV0.2-59
    enabled: false
  dasm_thrifty:
    name: DASMHumV1.0-4M
    thrifty_name: ThriftyHumV0.2-59
    enabled: false
  cosine:
    ckpt: antibody_benchmark/data/raw/cosine/checkpoints/cosine_dasm.ckpt
    guided: false
    enabled: false
  treesbm:
    checkpoint: checkpoints/ab_dasm_v1/best.pt
    force_observed_topology: true
    max_seq_len: 200
    enabled: true
  identity_null:
    enabled: false

fairness:
  same_families: true
  same_root: true
  same_topology: true
  same_branch_lengths: true
  recursive_generated_parents: true
  hide_nonroot_truth: true
  family_level_isolation: true

optional_neutral_shm:
  enabled: false
  dryad_dir: antibody_benchmark/data/raw/thrifty/extracted
  note: "DEFERRED — optional secondary benchmark (Dryad 401; not required for primary)."

tree_generation_experiment:
  enabled: false
  note: "Scaffold only — evaluate TreeSBM joint tree gen separately later."
