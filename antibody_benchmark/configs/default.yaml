# Primary fixed-topology recursive rollout benchmark
seed: 42
n_rollouts: 20
n_bootstrap: 1000
bootstrap_ci: 0.95

paths:
  # Override with env AB_DASM_DIR (Betty canonical):
  #   ~/antibody_benchmark_raw/dasm/extracted/dasm-experiments-data
  raw_dasm: antibody_benchmark/data/raw/dasm/extracted/dasm-experiments-data
  raw_cosine_ckpt: antibody_benchmark/data/raw/cosine/checkpoints/cosine_dasm.ckpt
  raw_cosine_data: antibody_benchmark/data/raw/cosine/hf_dataset
  processed: antibody_benchmark/data/processed
  splits: antibody_benchmark/data/splits
  results: antibody_benchmark/results
  netam_repo: antibody_benchmark/data/raw/repos/netam
  cosine_repo: antibody_benchmark/data/raw/repos/cosine

dataset:
  # Published DASM/CoSiNE held-out source (Zenodo v3 is upstream no-naive)
  primary_pcp: v3/rodriguez-airr-seq-race-prod-NoWinCheck_igh_pcp_2024-11-12_MASKED_NI_noN_no-naive.csv.gz
  chain: heavy  # heavy | paired
  min_leaves: 4
  min_depth: 2
  require_single_root: true  # exclude multi-root; never fabricate naive edges
  alphabet_for_metrics: aa  # translate NT -> AA for shared metrics
  max_families: null  # set int for smoke; null = full freeze

models:
  thrifty:
    name: ThriftyHumV0.2-59
    enabled: true  # requires netam + pretrained download
  dasm_thrifty:
    name: DASMHumV1.0-4M
    thrifty_name: ThriftyHumV0.2-59
    enabled: true  # requires netam + pretrained download
  cosine:
    ckpt: antibody_benchmark/data/raw/cosine/checkpoints/cosine_dasm.ckpt
    guided: false  # MUST remain false for main benchmark
    enabled: true  # requires cosine env + ckpt wiring
  treesbm:
    # Force observed topology+BL; sequence-only comparison
    checkpoint: checkpoints/best.pt  # Betty / local project checkpoint
    force_observed_topology: true
    enabled: false  # enable in configs/full.yaml (or --models treesbm)
  # Pipeline smoke only — not a paper baseline
  identity_null:
    enabled: false

fairness:
  same_families: true
  same_root: true
  same_topology: true
  same_branch_lengths: true
  recursive_generated_parents: true
  hide_nonroot_truth: true
  family_level_isolation: true

optional_neutral_shm:
  enabled: false
  dryad_dir: antibody_benchmark/data/raw/thrifty/extracted
  note: "DEFERRED — optional secondary benchmark (Dryad 401; not required for primary)."

tree_generation_experiment:
  enabled: false
  note: "Scaffold only — evaluate TreeSBM joint tree gen separately later."
