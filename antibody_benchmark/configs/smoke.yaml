# Local/Betty smoke: data rebuild + null-model rollout + metrics (TEMP labels)
seed: 0
n_rollouts: 3
n_bootstrap: 50
bootstrap_ci: 0.95

paths:
  # Override with AB_DASM_DIR on Betty if needed
  raw_dasm: antibody_benchmark/data/raw/dasm/extracted/dasm-experiments-data
  processed: antibody_benchmark/data/processed
  splits: antibody_benchmark/data/splits
  results: antibody_benchmark/results

dataset:
  primary_pcp: v3/rodriguez-airr-seq-race-prod-NoWinCheck_igh_pcp_2024-11-12_MASKED_NI_noN_no-naive.csv.gz
  chain: heavy
  min_leaves: 4
  min_depth: 2
  require_single_root: true
  alphabet_for_metrics: aa
  # Smoke may subsample rollouts; full freeze uses default.yaml (max_families: null)
  max_families: null

models:
  thrifty:
    enabled: false
  dasm_thrifty:
    enabled: false
  cosine:
    guided: false
    enabled: false
  treesbm:
    force_observed_topology: true
    enabled: false
  identity_null:
    enabled: true

fairness:
  recursive_generated_parents: true
  hide_nonroot_truth: true
  family_level_isolation: true
